services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-downloader-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-downloads:/tmp/bot-downloads
      - bot-cache:/usr/src/app/data
      - ./ig-cookies.txt:/usr/src/app/ig-cookies.txt
      - ./tiktok-cookies.txt:/usr/src/app/tiktok-cookies.txt
      - ./yt-cookies.txt:/usr/src/app/yt-cookies.txt
      - ./cookies:/usr/src/app/cookies
      - ./allowed-users.json:/usr/src/app/allowed-users.json:ro
      - ./logs:/usr/src/app/logs
    environment:
      - CACHE_DIR=/usr/src/app/data

volumes:
  bot-downloads:
  bot-cache:
