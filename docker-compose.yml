services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-downloader-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-downloads:/tmp/bot-downloads
      - ./ig-cookies.txt:/usr/src/app/ig-cookies.txt:ro
      - ./ig-session.json:/usr/src/app/ig-session.json
      - ./allowed-users.json:/usr/src/app/allowed-users.json:ro
      - ./logs:/usr/src/app/logs
      - ./data:/usr/src/app/data
    environment:
      - CACHE_DIR=/usr/src/app/data

volumes:
  bot-downloads:
