services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-downloader-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-downloads:/tmp/bot-downloads
      - ./cookies.txt:/usr/src/app/cookies.txt:ro
      - ./allowed-users.json:/usr/src/app/allowed-users.json:ro
      - ./logs:/usr/src/app/logs

volumes:
  bot-downloads:
